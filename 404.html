<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 - 에이블텍</title>
<script>
/* 발행본: /daara_admin 시크릿 진입 — 플래그를 심고 클린 주소로 되돌린 뒤 사이트를 연다(주소창에 daara_admin 미노출) */
(function () {
  var m = location.pathname.match(/\/daara_admin\/?$/);
  if (!m) return;
  var base = location.pathname.slice(0, location.pathname.length - m[0].length) + '/';
  try { sessionStorage.setItem('daara_admin', '1'); location.replace(base); }
  catch (e) { location.replace(base + '#daara_admin'); }
})();
</script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;color:#111827;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:24px;text-align:center}
main{max-width:440px}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;background:#2563EB;color:#fff;font-size:13px;font-weight:700;letter-spacing:.12em}
h1{font-size:26px;margin:18px 0 8px}
p{color:#4b5563;font-size:15px;line-height:1.6;margin:0 0 24px}
a{display:inline-block;padding:12px 28px;border-radius:10px;background:#2563EB;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
a:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
small{display:block;margin-top:18px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<main>
  <span class="badge">404</span>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있습니다.<br>아래 버튼으로 사이트 홈으로 이동해 주세요.</p>
  <a id="home" href="/">사이트 홈으로 이동</a>
  <small>에이블텍</small>
</main>
<script>
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var home = seg.length > 1 ? '/' + seg.slice(0, -1).join('/') + '/' : '/';
  document.getElementById('home').setAttribute('href', home);
})();
</script>
</body>
</html>
